<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>k-AIzen — OG-Card 1200×630</title>
<style>
  /* OG-Card k-aizen.de — 1200×630, Screenshot via Playwright (file://).
     Gestaltung: Fable 5, 2026-08-23. Palette = Live-Seite (warmes Charcoal + Ember).
     Bildidee: Der Dreiklang fällt als Treppe der Lichtquelle entgegen —
     „Gebucht." landet im Glühen. Eine Inszenierung, kein Effekt-Stapel. */

  @font-face {
    font-family: "Plus Jakarta Sans";
    src: url("../../public/fonts/plus-jakarta-sans-500-latin.woff2") format("woff2");
    font-weight: 500;
    font-style: normal;
  }
  @font-face {
    font-family: "Plus Jakarta Sans";
    src: url("../../public/fonts/plus-jakarta-sans-600-latin.woff2") format("woff2");
    font-weight: 600;
    font-style: normal;
  }
  @font-face {
    font-family: "Plus Jakarta Sans";
    src: url("../../public/fonts/plus-jakarta-sans-800-latin.woff2") format("woff2");
    font-weight: 800;
    font-style: normal;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { background: #141210; }

  body {
    width: 1200px;
    height: 630px;
    margin: 0;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    padding: 60px; /* Sicherheitsrand — nichts Wichtiges außerhalb */
    font-family: "Plus Jakarta Sans", sans-serif;
    background: #141210;
    /* leiser warmer Grundton Richtung Lichtquelle unten rechts */
    background-image: radial-gradient(150% 170% at 94% 102%, #201712 0%, #141210 55%);
  }

  /* Die eine Lichtquelle: Glut aus der unteren rechten Ecke */
  .glow {
    position: absolute;
    right: -330px;
    bottom: -400px;
    width: 1080px;
    height: 1080px;
    background: radial-gradient(
      circle,
      rgba(255, 122, 69, 0.30) 0%,
      rgba(232, 90, 43, 0.14) 38%,
      rgba(232, 90, 43, 0.05) 56%,
      rgba(232, 90, 43, 0) 72%
    );
  }

  /* Kopfzeile: Absender links, Adresse rechts */
  .top {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .top img { height: 74px; width: auto; display: block; }
  .domain {
    font-size: 27px;
    font-weight: 600;
    color: #F4EDE5;
    letter-spacing: -0.01em;
  }

  /* Der Dreiklang: wächst in Grad und Wärme, wandert der Glut entgegen */
  h1 {
    position: relative;
    z-index: 1;
    margin-top: 62px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.035em;
  }
  h1 span { display: block; }
  .w1 { font-size: 68px;  color: #C7B5A5; }
  .w2 { font-size: 94px;  color: #F4EDE5; margin: 12px 0 0 62px; }
  .w3 {
    font-size: 128px;
    color: #FF8F5E; /* Ember als Text — 8.3:1 auf #141210 */
    margin: 14px 0 0 138px;
    text-shadow:
      0 4px 70px rgba(255, 122, 69, 0.45),
      0 2px 26px rgba(232, 90, 43, 0.35);
  }

  /* Die eine Zeile, die sagt, worum es geht */
  .tagline {
    position: relative;
    z-index: 1;
    margin-top: auto;
    font-size: 29px;
    font-weight: 500;
    color: #C7B5A5; /* aus dem Warmton getönt, nie Grau */
    letter-spacing: -0.005em;
  }

  /* Korn über allem — bindet Fläche, Glut und Type zu einem Material */
  .grain {
    position: absolute;
    inset: 0;
    z-index: 2;
    opacity: 0.05;
    pointer-events: none;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="280" height="280"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="280" height="280" filter="url(%23n)"/></svg>');
  }
</style>
</head>
<body>
  <div class="glow"></div>

  <div class="top">
    <img src="../../public/images/logo/k-aizen-logo-hell.png" alt="k-AIzen">
    <div class="domain">k-aizen.de</div>
  </div>

  <h1>
    <span class="w1">Gefunden.</span>
    <span class="w2">Gefragt.</span>
    <span class="w3">Gebucht.</span>
  </h1>

  <p class="tagline">Die Website, die dir den Auftragskalender füllt.</p>

  <div class="grain"></div>
</body>
</html>
