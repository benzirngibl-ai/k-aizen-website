server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Astro build.format=directory → /pfad/ = /pfad/index.html
  #
  # Warum es diese Datei überhaupt gibt (28.07.2026): Vorher lief hier das
  # nackte nginx:alpine-Standardimage, das für HTML KEIN Cache-Control setzt.
  # Ohne diesen Header raten Browser die Frische selbst — Faustregel: 10 % des
  # Dateialters. Bei einer Seite, die zwei Wochen unverändert war, sind das gut
  # anderthalb Tage, in denen ein Wiederbesucher nach dem Deploy weiter die
  # ALTE Seite sieht. Ben ist am 28.07. genau darüber gestolpert: Er bekam nach
  # dem Umbau noch die frühere KI-PA-Startseite zu sehen, samt Sprungmarke
  # #beispiel, die es dort gar nicht gab.
  #
  # no-cache heißt nicht "nicht speichern", sondern "vor Benutzung nachfragen".
  # Mit ETag kostet das einen 304 mit ein paar Bytes, kein erneutes Laden.

  # ---- FUNNEL-UMBAU 2026-08-21 (Ben): Altlasten dauerhaft umgeleitet ----
  # Die Seite verkauft nur noch das Website-Paket. Alles aus der KI-PA-Welt
  # (/ki-pa, /audit, /funktionen) sowie die alten Katalog- und Pitch-Routen
  # wandern per 301 auf die Produktseite. 301 statt Meta-Refresh, weil Google
  # nur beim 301 die Bewertung der alten URL auf die neue überträgt — die alten
  # /katalog-Seiten hingen bis hierhin an einem Meta-Redirect und vererbten nichts.
  # Quelldateien liegen in _archive/2026-08-21-funnel-umbau/.
  location ~ ^/(ki-pa|audit)(/|$)                  { return 301 /meisterseite; }
  location ~ ^/funktionen(/|$)                     { return 301 /meisterseite; }
  location ~ ^/(katalog|katalog-v2)(/|$)           { return 301 /pricing; }
  location ~ ^/tutorials(/|$)                      { return 301 /blog/; }
  location ~ ^/(old-index|preview-lighttech)(/|$)  { return 301 /; }
  # ⚠️ /pitch ist zweierlei: die alten Pitch-Deck-ROUTEN (weg) und der
  # Bilderordner public/pitch/*.png, den die Seite weiter braucht. Deshalb
  # greift die Regel ausdrücklich nur auf die HTML-Adressen, nie auf Dateien.
  location ~ ^/pitch/?$                            { return 301 /meisterseite; }
  location ~ ^/pitch/(lena|markus)/?$              { return 301 /meisterseite; }

  location / {
    try_files $uri $uri/index.html $uri/ =404;
    add_header Cache-Control "no-cache" always;
  }

  error_page 404 /404.html;

  # robots.txt / llms.txt sind Astro-Endpoints und liegen als Datei im dist
  location = /robots.txt    { default_type text/plain; add_header Cache-Control "no-cache" always; }
  location = /llms.txt      { default_type text/plain; add_header Cache-Control "no-cache" always; }
  location = /llms-full.txt { default_type text/plain; add_header Cache-Control "no-cache" always; }

  # security.txt (RFC 9116) — MUSS als text/plain mit charset=utf-8 ausgeliefert
  # werden, sonst ist sie formal ungueltig. `charset utf-8` haengt den Parameter
  # an; ohne die Zeile liefert nginx text/plain ohne charset.
  location = /.well-known/security.txt {
    default_type text/plain;
    charset utf-8;
    add_header Cache-Control "no-cache" always;
  }

  # Astro hängt gebündelten Assets einen Hash an den Namen — ändert sich der
  # Inhalt, ändert sich die URL. Die dürfen ewig liegen bleiben.
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Bilder und Symbole tragen KEINEN Hash: /images/demo/muster-desktop.webp
  # heißt weiter so, auch wenn ein neuer Screenshot dahinterliegt. Deshalb eine
  # Stunde statt einem Jahr — lange genug fürs Weiterklicken, kurz genug, dass
  # ein Austausch nicht tagelang untergeht.
  location /images/ { add_header Cache-Control "public, max-age=3600" always; }
  location /icons/  { add_header Cache-Control "public, max-age=3600" always; }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
  gzip_min_length 512;
}
